apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

namePrefix: dev-

commonLabels:
  environment: dev

bases:
  - ../../base

replicas:
  - name: angellllkr-estate
    count: 1

patchesStrategicMerge:
  - deployment.yaml

configMapGenerator:
  - name: angellllkr-config
    behavior: merge
    literals:
      - environment=development
      - log_level=debug