apiVersion: apps/v1
kind: Deployment
metadata:
  name: angellllkr-estate
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: angellllkr-estate
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi