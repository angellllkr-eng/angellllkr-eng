apiVersion: apps/v1
kind: Deployment
metadata:
  name: angellllkr-estate
  labels:
    app: angellllkr-estate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: angellllkr-estate
  template:
    metadata:
      labels:
        app: angellllkr-estate
    spec:
      containers:
      - name: angellllkr-estate
        image: angellllkr-estate:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ESTATE_ENV
          valueFrom:
            configMapKeyRef:
              name: angellllkr-config
              key: environment
        - name: SERVICE_VERSION
          value: "v1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - angellllkr-estate
              topologyKey: kubernetes.io/hostname